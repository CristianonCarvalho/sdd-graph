<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa SDD <!--__PROJECT__--></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<!--__D3__-->
<style>
  :root{
    --sg-primary:#FF904D; --sg-crop:#35D07F; --sg-bg:#000000;
    --sg-text:#ffffff; --sg-text-soft:rgba(255,255,255,.70); --sg-text-softer:rgba(255,255,255,.50);
    --sg-card-bg:rgba(255,255,255,.05); --sg-card-border:rgba(255,255,255,.10);
    --sg-glow-soft:rgba(255,144,77,.15); --sg-glow-strong:rgba(255,144,77,.25);
    --sg-icon-bg:rgba(255,144,77,.15); --sg-icon-border:rgba(255,144,77,.30);
    --sg-pill-bg:rgba(255,255,255,.04); --sg-pill-border:rgba(255,255,255,.08);
    --sg-stage-glow:rgba(255,144,77,.06); --sg-accent-2:#FFC766;
    --c-p1:#FF904D; --c-p2:#FFC766; --c-p3:#35D07F;
    --c-setup:#6C7A89; --c-found:#8E7CC3; --c-polish:#5B8DEF;
    /* arquitetura: cor por tipo de componente */
    --k-actor:#FFC766; --k-ui:#5B8DEF; --k-api:#35D07F; --k-service:#FF904D;
    --k-integration:#8E7CC3; --k-external:#8C97A3; --k-model:#E86A92;
    --k-datastore:#5AC8FA; --k-config:#9AA0A6; --k-fr:#B7A0E0;
    /* diagnóstico (sobreposição): cor por severidade */
    --diag-error:#F5595F; --diag-warn:#F0B429; --diag-info:#5B8DEF;
    /* diff (sobreposição): novo / concluído desde a base / alterado */
    --diff-new:#5B8DEF; --diff-done:#35D07F; --diff-chg:#FFC766;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--sg-bg);color:var(--sg-text);font-family:'Inter',sans-serif;overflow:hidden}
  .mono{font-family:'JetBrains Mono',monospace}
  .app{display:flex;flex-direction:column;height:100vh}
  header.top{padding:12px 22px;border-bottom:1px solid var(--sg-card-border);display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(180deg,rgba(255,144,77,.04),transparent)}
  header.top h1{font-size:17px;font-weight:800;margin:0;letter-spacing:-.3px}
  header.top h1 .dot{color:var(--sg-primary)}
  header.top .sub{font-size:12px;color:var(--sg-text-softer)}
  .conf{font-size:11px;font-weight:700;padding:2px 9px;border-radius:9999px;vertical-align:middle;margin-left:4px}
  .seg{display:flex;background:var(--sg-pill-bg);border:1px solid var(--sg-pill-border);border-radius:9999px;padding:3px;flex-wrap:wrap}
  .seg button{background:none;border:none;color:var(--sg-text-soft);font:inherit;font-size:12px;font-weight:600;padding:6px 13px;border-radius:9999px;cursor:pointer;transition:.2s;white-space:nowrap}
  .seg button.active{background:var(--sg-icon-bg);color:var(--sg-primary)}
  .tabs{display:flex;gap:4px;background:var(--sg-pill-bg);border:1px solid var(--sg-pill-border);border-radius:12px;padding:4px}
  .tabs button{background:none;border:none;color:var(--sg-text-soft);font:inherit;font-size:13px;font-weight:700;padding:7px 16px;border-radius:9px;cursor:pointer;transition:.2s}
  .tabs button.active{background:var(--sg-primary);color:#1a1204}
  .ctrls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--sg-pill-bg);border:1px solid var(--sg-pill-border);border-radius:9999px;padding:6px 12px;font-size:12px;color:var(--sg-text-soft);cursor:pointer;user-select:none;transition:.2s}
  .chip.off{opacity:.32}
  .chip .sw{width:11px;height:11px;border-radius:50%}
  .hide{display:none!important}
  .search{background:var(--sg-pill-bg);border:1px solid var(--sg-pill-border);border-radius:9999px;padding:6px 14px;color:var(--sg-text);font:inherit;font-size:12px;width:150px;outline:none}
  .search:focus{border-color:var(--sg-icon-border)}
  #searchNav{gap:4px;padding:4px 8px;font-size:12px;color:var(--sg-text-soft)}
  .navb{background:none;border:none;color:var(--sg-text-soft);font-size:15px;line-height:1;cursor:pointer;padding:0 3px}
  .navb:hover{color:var(--sg-primary)}
  #minimap{position:absolute;right:14px;bottom:14px;width:158px;height:114px;background:var(--sg-card-bg);border:1px solid var(--sg-card-border);border-radius:8px;backdrop-filter:blur(6px);cursor:pointer;z-index:4}
  #minimap .vp{fill:var(--sg-glow-strong);stroke:var(--sg-primary);stroke-width:1.5px;vector-effect:non-scaling-stroke}
  @media (max-width:820px){ #minimap{display:none} }
  main{flex:1;display:flex;min-height:0}
  .stage{flex:1;position:relative;background:radial-gradient(circle at 50% 45%,var(--sg-stage-glow),transparent 72%);overflow:hidden}
  .stage svg{width:100%;height:100%;display:block;cursor:grab}
  .stage svg:active{cursor:grabbing}
  .hint{position:absolute;left:16px;bottom:14px;font-size:11px;color:var(--sg-text-softer);pointer-events:none}
  .replay{position:absolute;top:14px;right:14px;z-index:5;background:var(--sg-pill-bg);border:1px solid var(--sg-pill-border);color:var(--sg-text-soft);border-radius:9999px;padding:7px 15px;font:inherit;font-size:12px;cursor:pointer;transition:.2s}
  .replay:hover{background:var(--sg-icon-bg);color:var(--sg-primary)}
  aside{width:330px;flex:0 0 330px;border-left:1px solid var(--sg-card-border);padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;background:rgba(255,255,255,.015)}
  .card{background:var(--sg-card-bg);border:1px solid var(--sg-card-border);border-radius:14px;padding:14px 15px;backdrop-filter:blur(10px)}
  .card h3{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--sg-text-softer)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .stat{background:var(--sg-pill-bg);border:1px solid var(--sg-pill-border);border-radius:10px;padding:9px 11px}
  .stat .n{font-size:22px;font-weight:800;line-height:1}
  .stat .l{font-size:10.5px;color:var(--sg-text-softer);margin-top:3px}
  .legrow{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--sg-text-soft);padding:3px 0}
  .legrow .sw{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
  .legnote{font-size:11px;color:var(--sg-text-softer);line-height:1.5;margin-top:8px}
  .pbar{height:9px;border-radius:9999px;background:var(--sg-pill-bg);border:1px solid var(--sg-pill-border);overflow:hidden}
  .pfill{height:100%;background:linear-gradient(90deg,var(--c-p3),var(--sg-primary));border-radius:9999px;transition:width .6s ease}
  .pmeta{font-size:12px;color:var(--sg-text-soft);margin-top:7px;font-weight:600}
  .pby{margin-top:9px;display:flex;flex-direction:column;gap:5px}
  .pbyrow{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--sg-text-softer)}
  .pbyrow .mini{flex:1;height:5px;border-radius:9999px;background:var(--sg-pill-bg);overflow:hidden}
  .pbyrow .mini i{display:block;height:100%;border-radius:9999px}
  .nextitem{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sg-text-soft);padding:6px 8px;border-radius:8px;cursor:pointer;transition:.15s}
  .nextitem:hover{background:var(--sg-icon-bg)}
  .nextitem .tid{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--sg-accent-2)}
  .nextitem .sw{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .node.done circle,.node.done path.sh{stroke:var(--c-p3);stroke-width:2px}
  .node.next circle,.node.next path.sh{stroke:var(--sg-accent-2);stroke-width:2.5px}
  .detail-card .empty{font-size:12px;color:var(--sg-text-softer);line-height:1.6}
  .detail-card .tid{font-size:13px;font-weight:700}
  .detail-card .badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:9999px;margin-left:7px;vertical-align:middle}
  .detail-card .lab{font-size:12.5px;color:var(--sg-text-soft);line-height:1.55;margin:10px 0}
  .detail-card .meta{font-size:11px;color:var(--sg-text-softer);margin:4px 0}
  .detail-card .meta b{color:var(--sg-text-soft);font-weight:600}
  .detail-card code{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sg-accent-2);cursor:pointer}
  .detail-card code:hover{text-decoration:underline}
  .frtag{display:inline-block;background:var(--sg-icon-bg);border:1px solid var(--sg-icon-border);color:var(--sg-primary);font-size:10px;font-weight:600;padding:1px 7px;border-radius:6px;margin:2px 4px 2px 0}
  /* tooltip de hover: mesmo cartão visual do #detail (classe .detail-card), flutuante e
     sem interação própria — só aparece/some com o hover do nó, nunca captura o mouse. */
  .hovertip{position:fixed;z-index:50;max-width:min(280px,90vw);overflow-y:auto;pointer-events:none;box-shadow:0 14px 40px rgba(0,0,0,.35)}
  @media (hover:none),(pointer:coarse){ .hovertip{display:none!important} }
  .link{fill:none;stroke:rgba(255,255,255,.13);stroke-width:1.3px}
  .link.crit{stroke:var(--sg-primary);stroke-width:2.2px;opacity:.9}
  .node circle,.node path.sh{stroke:rgba(0,0,0,.45);stroke-width:1.5px;cursor:grab;transition:opacity .25s}
  .node:active circle,.node:active path.sh{cursor:grabbing}
  .node.crit circle,.node.crit path.sh{stroke:#fff;stroke-width:2px}
  .node text.id{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;fill:#fff;pointer-events:none;text-anchor:middle;dominant-baseline:central}
  .node text.ext{font-size:11px;font-weight:600;fill:var(--sg-text-soft);pointer-events:none;dominant-baseline:central}
  .dim{opacity:.08!important}
  .link.dim{opacity:.04!important}
  /* #17 diagnóstico sobreposto: marcador de severidade no nó (visível só com o toggle) */
  .diagdot{display:none;stroke:var(--sg-bg);stroke-width:1.5px;pointer-events:none}
  body.diag-on .diagdot{display:inline}
  .diagsev{display:inline-block;width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .diagitem{display:flex;align-items:flex-start;gap:8px;font-size:11.5px;color:var(--sg-text-soft);line-height:1.45;padding:6px 8px;border-radius:8px;cursor:pointer;transition:.15s}
  .diagitem:hover{background:var(--sg-icon-bg)}
  .diagitem .rid{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--sg-accent-2);font-size:10.5px}
  .diagcounts{display:flex;gap:8px;margin-bottom:10px}
  .diagcounts .dc{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
  #detail .findings{margin-top:10px;border-top:1px solid var(--sg-card-border);padding-top:9px}
  #detail .findings .diagitem{padding:4px 0;cursor:default}
  #detail .findings .diagitem:hover{background:none}
  /* v0.6.1 diff sobreposto: marcador no canto superior-esquerdo (não colide com o de diagnóstico) */
  .diffdot{display:none;stroke:var(--sg-bg);stroke-width:1.5px;pointer-events:none}
  body.diff-on .diffdot{display:inline}
  #diffBase{font-size:11px;color:var(--sg-text-softer);margin-bottom:9px;font-family:'JetBrains Mono',monospace}
  .diffmeta{font-size:11.5px;color:var(--sg-text-softer);padding:5px 8px}
  /* #15 foco: banner de saída */
  #focusBadge{background:var(--sg-icon-bg);border-color:var(--sg-icon-border);color:var(--sg-primary);font-weight:600}
  #focusBadge .x{margin-left:4px;font-weight:700}
  .node.faded{opacity:.05!important;pointer-events:none}
  /* #16 standup: painel sobreposto */
  .ovl{position:absolute;inset:0;z-index:8;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:26px}
  :root[data-theme="light"] .ovl{background:rgba(255,255,255,.55)}
  .ovl .panel{background:var(--sg-bg);border:1px solid var(--sg-card-border);border-radius:18px;padding:20px 22px;width:min(920px,96%);max-height:88%;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.5)}
  .ovl .phead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .ovl .phead h2{margin:0;font-size:16px;font-weight:800}
  .ovl .phead .pdate{font-size:12px;color:var(--sg-text-softer)}
  .ovl .close{margin-left:auto;background:var(--sg-pill-bg);border:1px solid var(--sg-pill-border);color:var(--sg-text-soft);border-radius:9999px;width:30px;height:30px;font-size:16px;cursor:pointer}
  .ovl .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media (max-width:760px){ .ovl .cols{grid-template-columns:1fr 1fr} }
  .ovl .col{background:var(--sg-card-bg);border:1px solid var(--sg-card-border);border-radius:12px;padding:12px;min-height:80px}
  .ovl .col h4{margin:0 0 9px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .ovl .col h4 .cn{margin-left:auto;font-size:13px}
  .ovl .su{display:flex;align-items:baseline;gap:7px;font-size:12px;color:var(--sg-text-soft);padding:5px 6px;border-radius:7px;cursor:pointer;line-height:1.4}
  .ovl .su:hover{background:var(--sg-icon-bg)}
  .ovl .su .tid{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--sg-accent-2);font-size:11px;flex:0 0 auto}
  .ovl .col .none{font-size:11.5px;color:var(--sg-text-softer);padding:5px 6px}
  /* painel de timeline (📈): gráfico + tabela */
  #tlchart{margin:6px 0 14px}
  #tlchart svg{width:100%;height:auto;display:block}
  #tlchart .grid{stroke:var(--sg-card-border);stroke-width:1}
  #tlchart .area{fill:var(--sg-primary);opacity:.12}
  #tlchart .ln{fill:none;stroke:var(--sg-primary);stroke-width:2}
  #tlchart .dot{fill:var(--sg-primary);stroke:var(--sg-bg);stroke-width:1.5}
  #tlchart .pv{fill:var(--sg-text-soft);font-size:9px;font-weight:600;text-anchor:middle}
  #tlchart .px{fill:var(--sg-text-softer);font-size:8.5px;text-anchor:middle}
  #tlchart .ax{fill:var(--sg-text-softer);font-size:9px;text-anchor:end}
  .tltab{width:100%;border-collapse:collapse;font-size:12px}
  .tltab th{text-align:right;font-weight:600;color:var(--sg-text-softer);padding:5px 8px;border-bottom:1px solid var(--sg-card-border);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
  .tltab th:first-child,.tltab td:first-child,.tltab th:nth-child(2),.tltab td:nth-child(2){text-align:left}
  .tltab td{padding:5px 8px;border-bottom:1px solid var(--sg-card-border);color:var(--sg-text-soft);text-align:right}
  .tltab td.mono{font-family:'JetBrains Mono',monospace;color:var(--sg-accent-2);font-weight:600}
  @media (max-width:820px){ aside{display:none} .search{width:110px} }

  /* Paleta segura para daltonismo (Okabe-Ito) — matizes distinguíveis em deuteranopia/protanopia */
  :root[data-palette="safe"]{
    --c-p1:#D55E00; --c-p2:#E69F00; --c-p3:#009E73; --c-setup:#56B4E9; --c-found:#CC79A7; --c-polish:#0072B2;
    --k-actor:#E69F00; --k-ui:#56B4E9; --k-api:#009E73; --k-service:#D55E00; --k-integration:#CC79A7;
    --k-external:#8C97A3; --k-model:#0072B2; --k-datastore:#56B4E9; --k-config:#9AA0A6; --k-fr:#CC79A7;
    --sg-primary:#D55E00; --sg-accent-2:#E69F00;
    --diag-error:#D55E00; --diag-warn:#E69F00; --diag-info:#0072B2;
    --diff-new:#0072B2; --diff-done:#009E73; --diff-chg:#E69F00;
  }
  /* Tema claro / impressão */
  :root[data-theme="light"]{
    --sg-bg:#ffffff; --sg-text:#15181d; --sg-text-soft:rgba(20,24,29,.72); --sg-text-softer:rgba(20,24,29,.5);
    --sg-card-bg:rgba(20,24,29,.03); --sg-card-border:rgba(20,24,29,.12);
    --sg-pill-bg:rgba(20,24,29,.04); --sg-pill-border:rgba(20,24,29,.12);
    --sg-glow-soft:rgba(255,144,77,.10); --sg-stage-glow:rgba(255,144,77,.05);
  }
  :root[data-theme="light"] .node text.id{fill:#fff}
  :root[data-theme="light"] .link{stroke:rgba(20,24,29,.22)}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important} .pfill{transition:none} }
  @media print{
    :root{ --sg-bg:#fff; --sg-text:#000; }
    body{background:#fff} .replay,.tabs,.ctrls,#linkBtn{display:none!important}
    .link{stroke:#555!important} aside{border-color:#ccc}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>Mapa SDD <span class="dot">·</span> <span id="hproj"></span> <span class="conf" id="confBadge"></span></h1>
      <div class="sub" id="tabsub">Dependências entre tasks</div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="seg" id="specSeg"></div>
    <div class="ctrls">
      <input class="search" id="search" placeholder="buscar… (Enter)">
      <span class="chip hide" id="searchNav"><button class="navb" id="navPrev">‹</button><span id="searchCount">0</span><button class="navb" id="navNext">›</button></span>
      <span class="chip" id="linkBtn" title="copiar link desta visão">🔗 link</span>
      <span class="chip" id="themeBtn" title="tema claro / escuro">◐ tema</span>
      <span class="chip off" id="paletteBtn" title="paleta segura para daltonismo">🎨 paleta</span>
      <span class="chip" id="pngBtn" title="baixar PNG desta visão">⬇ PNG</span>
      <span class="chip" id="svgBtn" title="baixar SVG desta visão">⬇ SVG</span>
      <span class="chip hide" id="focusBadge" title="sair do modo de foco">🎯 <span id="focusId"></span><span class="x">✕</span></span>
      <span class="chip off hide" id="diffToggle" title="o que mudou desde a base (novo/concluído/alterado)"><span class="sw" style="background:var(--diff-done)"></span>diff</span>
      <span class="chip off" id="diagToggle"><span class="sw" style="background:var(--diag-warn)"></span>diagnóstico</span>
      <span class="chip" id="standupBtn" title="quadro kanban (o que está feito, em andamento, a fazer) — derivado do plano">📋 kanban</span>
      <span class="chip hide" id="timelineBtn" title="evolução do plano ao longo dos commits">📈 timeline</span>
      <span class="chip" id="critToggle"><span class="sw" style="background:var(--sg-primary)"></span>caminho crítico</span>
      <span class="chip off" id="doneToggle"><span class="sw" style="background:var(--c-p3)"></span>ocultar concluídas</span>
      <span class="chip" id="priBar"></span>
    </div>
  </header>
  <main>
    <div class="stage">
      <button class="replay" id="replay">↻ reanimar</button>
      <svg id="svg"></svg>
      <svg id="minimap"></svg>
      <div class="hint" id="hint"></div>
      <div id="standup" class="ovl hide"></div>
      <div id="tlpanel" class="ovl hide"></div>
      <div id="hovertip" class="card detail-card hovertip hide"></div>
    </div>
    <aside>
      <div class="card"><h3 id="statsTitle">Resumo</h3><div class="stats" id="stats"></div></div>
      <div class="card hide" id="progressCard"><h3>Progresso</h3><div class="pbar"><div class="pfill" id="pfill"></div></div><div class="pmeta" id="pmeta"></div><div class="pby" id="pby"></div></div>
      <div class="card hide" id="nextCard"><h3>Faça isto a seguir</h3><div id="nextList"></div></div>
      <div class="card hide" id="diffCard"><h3>Diff do plano</h3><div id="diffBase"></div><div id="diffList"></div></div>
      <div class="card hide" id="diagCard"><h3>Diagnóstico do plano</h3><div class="diagcounts" id="diagCounts"></div><div id="diagList"></div></div>
      <div class="card"><h3 id="legTitle">Legenda</h3><div id="legend"></div><div class="legnote" id="legnote"></div></div>
      <div class="card detail-card" id="detail"><h3>Detalhe</h3><div class="empty">Clique num nó para ver os detalhes.</div></div>
    </aside>
  </main>
</div>
<!--__DATA__-->
<!--__TIMELINE__-->
<script>
const DATA = window.SPECKIT_DATA;
const TL = window.SPECKIT_TIMELINE || null;
const SPECS = Object.keys(DATA);
const PRI = {
  P1:{c:'--c-p1',label:'P1 · MVP/crítico'}, P2:{c:'--c-p2',label:'P2 · importante'},
  P3:{c:'--c-p3',label:'P3 · desejável'}, FOUND:{c:'--c-found',label:'Fundação (bloqueia tudo)'},
  SETUP:{c:'--c-setup',label:'Setup'}, POLISH:{c:'--c-polish',label:'Polish / cross-cutting'}
};
const KIND = {
  actor:{c:'--k-actor',label:'Ator'}, ui:{c:'--k-ui',label:'Apresentação (UI)'},
  api:{c:'--k-api',label:'API'}, service:{c:'--k-service',label:'Serviços / domínio'},
  integration:{c:'--k-integration',label:'Integração (adapter)'}, external:{c:'--k-external',label:'Sistema externo'},
  model:{c:'--k-model',label:'Modelos / persistência'}, datastore:{c:'--k-datastore',label:'Banco de dados'},
  config:{c:'--k-config',label:'Configuração'}, fr:{c:'--k-fr',label:'Requisito (FR)'}, usecase:{c:'--k-actor',label:'Caso de uso'}
};
const cssv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const TABS = [
  {id:'deps', label:'Dependências', sub:'Dependências entre tasks'},
  {id:'usecases', label:'Casos de uso', sub:'Atores → casos de uso → requisitos'},
  {id:'arch', label:'Arquitetura', sub:'Componentes e fluxo (heurístico)'},
];
const DIAG = { error:{c:'--diag-error',label:'erro'}, warn:{c:'--diag-warn',label:'aviso'}, info:{c:'--diag-info',label:'info'} };
const SEVRANK = { error:0, warn:1, info:2 };
const DIFFK = { done:{c:'--diff-done',label:'concluída desde a base'}, new:{c:'--diff-new',label:'nova'}, changed:{c:'--diff-chg',label:'alterada'} };
const state = { spec:SPECS[0], tab:'deps', active:new Set(Object.keys(PRI)), crit:true, query:'', hideDone:false, diag:false, focus:null, showDiff:false };

// v0.6.1 mapeia cada task a um tipo de mudança desde a base (só na aba Dependências)
function diffFor(sp){
  const dd=sp.diff; if(!dd) return null;
  const m=new Map();
  (dd.tasks.completed||[]).forEach(x=>m.set(x.id,'done'));
  (dd.tasks.added||[]).forEach(x=>{ if(!m.has(x.id)) m.set(x.id,'new'); });
  [...(dd.tasks.statusChanged||[]),...(dd.tasks.priorityChanged||[]),...(dd.tasks.depsChanged||[])].forEach(x=>{ if(!m.has(x.id)) m.set(x.id,'changed'); });
  return m;
}
const anyDiff = SPECS.some(s=>!!DATA[s].diff);

// #17 mapeia cada achado do Doctor ao nó correspondente na aba atual
function diagFor(sp, tab){
  const res=new Map();
  const add=(nid,fd)=>{ const e=res.get(nid)||{findings:[]}; e.findings.push(fd); res.set(nid,e); };
  ((sp.diagnostics&&sp.diagnostics.findings)||[]).forEach(fd=>{
    let nid=null;
    if(tab==='deps'&&fd.targetKind==='task') nid=fd.targetId;
    else if(tab==='usecases'&&fd.targetKind==='fr') nid='fr_'+fd.targetId;
    else if(tab==='usecases'&&fd.targetKind==='story') nid=fd.targetId;
    else if(tab==='arch'&&fd.targetKind==='module') nid=fd.targetId;
    if(nid) add(nid,fd);
  });
  res.forEach(e=>{ e.sev=e.findings.map(f=>f.severity).sort((a,b)=>SEVRANK[a]-SEVRANK[b])[0]; });
  return res;
}

// ---------------- construtores de grafo (um por aba) ----------------
function normActor(a){ return /operador/i.test(a) ? 'Operador' : a.charAt(0).toUpperCase()+a.slice(1); }

function buildDeps(sp){
  const raw = sp.tasks;
  const byId = new Map(raw.map(n=>[n.id,{...n}]));
  const nodes=[...byId.values()], links=[];
  nodes.forEach(n=>n.deps.forEach(d=>{ if(byId.has(d)) links.push({source:d,target:n.id}); }));
  const inM=new Map(),outM=new Map(); nodes.forEach(n=>{inM.set(n.id,[]);outM.set(n.id,[]);});
  links.forEach(l=>{outM.get(l.source).push(l.target);inM.get(l.target).push(l.source);});
  const layer=new Map();
  const L=(id,s)=>{ if(layer.has(id))return layer.get(id); if(s.has(id))return 0; s.add(id);
    const ps=inM.get(id); const v=ps.length?Math.max(...ps.map(p=>L(p,s)))+1:0; layer.set(id,v); return v; };
  nodes.forEach(n=>n.layer=L(n.id,new Set()));
  const dmemo=new Map();
  const desc=(id,s)=>{ if(dmemo.has(id))return dmemo.get(id); if(s.has(id))return new Set(); s.add(id);
    const r=new Set(); outM.get(id).forEach(c=>{r.add(c); desc(c,s).forEach(x=>r.add(x));}); dmemo.set(id,r); return r; };
  nodes.forEach(n=>n.blocks=desc(n.id,new Set()).size);
  // caminho crítico
  const pl=new Map(),nx=new Map();
  const PL=id=>{ if(pl.has(id))return pl.get(id); let b=0,n=null; outM.get(id).forEach(c=>{const v=PL(c); if(v>b){b=v;n=c;}}); pl.set(id,b+1);nx.set(id,n);return b+1; };
  nodes.forEach(n=>PL(n.id));
  let st=null,bl=0; nodes.forEach(n=>{ if(!inM.get(n.id).length&&pl.get(n.id)>bl){bl=pl.get(n.id);st=n.id;} });
  if(!st) nodes.forEach(n=>{ if(pl.get(n.id)>bl){bl=pl.get(n.id);st=n.id;} });
  const crit=new Set(); let c=st; while(c){crit.add(c);c=nx.get(c);}
  links.forEach(l=>{ if(crit.has(l.source)&&crit.has(l.target)&&nx.get(l.source)===l.target) l.crit=true; });
  const rS=d3.scaleSqrt().domain([0,d3.max(nodes,n=>n.blocks)||1]).range([9,24]);
  const doneSet=new Set(nodes.filter(n=>n._t?.done ?? n.done).map(n=>n.id));
  const G={nodes:nodes.map(n=>({
    id:n.id, layer:n.layer, color:cssv(PRI[n.priority].c), r:rS(n.blocks),
    idText:n.id.replace(/^T0*/,'T'), crit:crit.has(n.id), done:!!n.done, inProgress:!!n.inProgress,
    unblocked:(!n.done && (n.deps||[]).every(d=>doneSet.has(d))), _t:n
  })), links, kind:'deps'};
  G.detail = (nd, opts={}) => {
    const n=nd._t; const depd=raw.filter(x=>x.deps.includes(n.id)).map(x=>x.id);
    // compact (usado no card de hover): omite as listas de refs — a própria dimmed/
    // highlight do hover já comunica visualmente quem depende de quem.
    const refsHtml = opts.compact ? '' : `
      <div class="meta"><b>Depende de:</b> ${refs(n.deps)}</div>
      <div class="meta"><b>Pré-requisito de:</b> ${refs(depd)}</div>`;
    return `<div><span class="tid mono">${n.id}</span>
      <span class="badge" style="${badge(cssv(PRI[n.priority].c))}">${n.priority}${n.parallel?' · ∥':''}${n.done?' · ✓':''}</span></div>
      <div class="lab">${mdcode(n.label)}</div>
      <div class="meta"><b>Fase:</b> ${n.phase}${n.story?` · <b>${n.story}</b>`:''}</div>
      <div class="meta"><b>Métricas:</b> depende de ${n.deps.length} · é pré-req. de ${depd.length} · desbloqueia ${n.blocks} no total</div>
      ${n.frs.length?`<div class="meta"><b>Requisitos:</b><br>${n.frs.map(f=>`<span class="frtag">${f}</span>`).join('')}</div>`:''}${refsHtml}`;
  };
  return G;
}

function buildUsecases(sp){
  // agrega FRs por user story a partir das tasks
  const frByUC={}; sp.tasks.forEach(t=>{ if(t.story){ (frByUC[t.story]=frByUC[t.story]||new Set()); t.frs.forEach(f=>frByUC[t.story].add(f)); } });
  const nodes=[],links=[];
  const actor='Operador';
  nodes.push({id:'actor', layer:0, color:cssv('--k-actor'), r:20, idText:'', name:actor, kind:'actor', _d:{type:'actor'}});
  const usedFR=new Set();
  sp.usecases.forEach(uc=>{
    const frs=[...(frByUC[uc.id]||[])].sort();
    nodes.push({id:uc.id, layer:1, color:cssv(PRI[uc.priority].c), r:13, idText:uc.id, name:uc.title, kind:'usecase', _d:{type:'uc',uc,frs}});
    links.push({source:'actor',target:uc.id});
    frs.forEach(f=>{ usedFR.add(f); links.push({source:uc.id,target:'fr_'+f}); });
  });
  // todos os FRs do spec.md; os sem task vinculada aparecem esmaecidos (sem aresta)
  const allFR=[...new Set([...usedFR, ...Object.keys(sp.frText)])].sort();
  allFR.forEach(f=>{
    const linked=usedFR.has(f);
    nodes.push({id:'fr_'+f, layer:2, color:cssv('--k-fr'), r:linked?8:6, idText:f.replace('FR-',''), name:f, kind:'fr',
      unlinked:!linked, _d:{type:'fr',fr:f,linked}});
  });
  const G={nodes,links,kind:'usecases'};
  G.detail = nd => {
    const d=nd._d;
    if(d.type==='actor') return `<div class="tid">${nd.name}</div><div class="meta">Ator do sistema. Ligado a ${sp.usecases.length} caso(s) de uso.</div>`;
    if(d.type==='uc') return `<div><span class="tid mono">${d.uc.id}</span>
      <span class="badge" style="${badge(cssv(PRI[d.uc.priority].c))}">${d.uc.priority}</span></div>
      <div class="lab">${d.uc.title}</div>
      <div class="meta">${d.uc.desc}</div>
      <div class="meta"><b>Requisitos cobertos:</b><br>${d.frs.length?d.frs.map(f=>`<span class="frtag">${f}</span>`).join(''):'—'}</div>`;
    if(d.type==='fr') return `<div class="tid mono">${d.fr}</div>
      <div class="lab">${sp.frText[d.fr]||'(texto não encontrado no spec.md)'}</div>
      <div class="meta"><b>Casos de uso:</b> ${refsUC(sp,d.fr)}</div>
      <div class="meta">${d.linked?'✓ Coberto por task(s).':'○ Sem task vinculada — consta apenas no spec.md.'}</div>`;
  };
  return G;
}

function buildArch(sp){
  const a=sp.arch;
  const nodes=a.nodes.map(n=>({
    id:n.id, layer:n.layer, color:cssv((KIND[n.kind]||KIND.config).c),
    r:n.kind==='external'||n.kind==='datastore'?15:(n.kind==='actor'?18:12),
    idText:'', name:n.label, kind:n.kind, _d:n
  }));
  const links=a.links.map(([s,t])=>({source:s,target:t}));
  const G={nodes,links,kind:'arch'};
  G.detail = nd => {
    const n=nd._d;
    return `<div class="tid">${n.label}</div>
      <span class="badge" style="${badge(cssv((KIND[n.kind]||KIND.config).c))}">${(KIND[n.kind]||{label:n.kind}).label}</span>
      ${n.items&&n.items.length?`<div class="meta"><b>Inclui:</b><br>${n.items.map(i=>`<span class="frtag">${i}</span>`).join('')}</div>`:''}
      ${sp.arch.meta.language?`<div class="meta"><b>Stack:</b> ${sp.arch.meta.language}</div>`:''}`;
  };
  return G;
}

const badge = c => `background:${c}22;color:${c};border:1px solid ${c}55`;
const mdcode = s => s.replace(/`([^`]+)`/g,'<code>$1</code>');
const refs = ids => ids.length?ids.map(x=>`<code data-id="${x}">${x}</code>`).join(' '):'—';
const refsUC = (sp,fr) => { const frByUC={}; sp.tasks.forEach(t=>{if(t.story)(frByUC[t.story]=frByUC[t.story]||new Set())&&t.frs.forEach(f=>frByUC[t.story].add(f));});
  const list=sp.usecases.filter(u=>frByUC[u.id]&&frByUC[u.id].has(fr)).map(u=>u.id); return list.length?list.join(', '):'—'; };

// ---------------- layout em camadas (compartilhado) ----------------
// Grafos grandes usam Sugiyama completo (dummies + minimização de cruzamentos
// por mediana + alinhamento); abaixo do limite, o barycenter simples basta.
// Tudo determinístico (desempates por id/chave). Benchmark: layout roda 1x por
// render — a ~500 nós fica em ~15ms, então o custo extra é imperceptível.
const SUGIYAMA_MIN=400;
function sugiyamaLayer(G,inM,outM,byId,layers,keys,COL,ROW,PADX,PADY){
  // vértices por camada = nós reais + "dummies" inseridos em arestas que pulam camadas
  const V=new Map(); keys.forEach(k=>V.set(k, layers[k].map(n=>({key:n.id,node:n,layer:k,up:[],dn:[]}))));
  const vindex=new Map(); V.forEach(col=>col.forEach(v=>vindex.set(v.key,v)));
  let dummyId=0; const chains=new Map();
  G.links.forEach(l=>{ const u=byId.get(l.source), w=byId.get(l.target); if(!u||!w||w.layer<=u.layer) return;
    let prev=vindex.get(u.id); const chain=[];
    for(let li=u.layer+1; li<w.layer; li++){ const dv={key:'§'+(dummyId++),node:null,layer:li,up:[],dn:[]};
      if(!V.has(li)) V.set(li,[]); V.get(li).push(dv); vindex.set(dv.key,dv);
      prev.dn.push(dv); dv.up.push(prev); chain.push(dv); prev=dv; }
    const wv=vindex.get(w.id); prev.dn.push(wv); wv.up.push(prev);
    if(chain.length) chains.set(l,chain);
  });
  const allKeys=[...V.keys()].sort((a,b)=>a-b);
  allKeys.forEach(k=>V.get(k).sort((a,b)=>a.key<b.key?-1:a.key>b.key?1:0)); // ordem inicial estável
  const posOf=col=>{ const m=new Map(); col.forEach((v,i)=>m.set(v.key,i)); return m; };
  const median=(nb,pos)=>{ const ps=nb.map(x=>pos.get(x.key)).filter(x=>x!=null).sort((a,b)=>a-b);
    if(!ps.length) return -1; const mid=ps.length>>1; return ps.length%2?ps[mid]:(ps[mid-1]+ps[mid])/2; };
  const reorder=col=>{ const res=new Array(col.length);
    col.forEach((v,i)=>{ if(v._m<0) res[i]=v; });                 // sem vizinho: fica no lugar
    const mov=col.filter(v=>v._m>=0).sort((a,b)=> a._m-b._m || (a.key<b.key?-1:1));
    let mi=0; for(let i=0;i<res.length;i++) if(res[i]===undefined) res[i]=mov[mi++];
    for(let i=0;i<col.length;i++) col[i]=res[i]; };
  for(let r=0;r<4;r++){                                            // varreduras desce/sobe
    for(let i=1;i<allKeys.length;i++){ const col=V.get(allKeys[i]), pp=posOf(V.get(allKeys[i-1]));
      col.forEach(v=>v._m=median(v.up,pp)); reorder(col); }
    for(let i=allKeys.length-2;i>=0;i--){ const col=V.get(allKeys[i]), np=posOf(V.get(allKeys[i+1]));
      col.forEach(v=>v._m=median(v.dn,np)); reorder(col); }
  }
  allKeys.forEach(k=>V.get(k).forEach((v,i)=>{ v.x=PADX+k*COL; v.y=PADY+i*ROW; })); // coords iniciais
  for(let pass=0; pass<3; pass++) allKeys.forEach(k=>{ const col=V.get(k);           // alinhamento
    col.forEach(v=>{ const nb=v.up.concat(v.dn); if(!nb.length){ v.ty=null; return; }
      const ys=nb.map(x=>x.y).sort((a,b)=>a-b), mid=ys.length>>1; v.ty=ys.length%2?ys[mid]:(ys[mid-1]+ys[mid])/2; });
    col.forEach(v=>{ if(v.ty!=null) v.y=v.ty; });
    for(let i=1;i<col.length;i++) if(col[i].y<col[i-1].y+ROW) col[i].y=col[i-1].y+ROW; // sem sobreposição
  });
  V.forEach(col=>col.forEach(v=>{ if(v.node){ v.node.x=v.x; v.node.y=v.y; } }));
  G.links.forEach(l=>{ const ch=chains.get(l); l.waypoints=(ch&&ch.length)?ch.map(v=>({x:v.x,y:v.y})):null; });
}
function layout(G){
  const inM=new Map(),outM=new Map(); G.nodes.forEach(n=>{inM.set(n.id,[]);outM.set(n.id,[]);});
  const byId=new Map(G.nodes.map(n=>[n.id,n]));
  G.links.forEach(l=>{ if(byId.has(l.source)&&byId.has(l.target)){outM.get(l.source).push(l.target);inM.get(l.target).push(l.source);} });
  G._in=inM; G._out=outM; G._byId=byId;
  const layers={}; G.nodes.forEach(n=>(layers[n.layer]=layers[n.layer]||[]).push(n));
  const COL=210,ROW=52,PADX=95,PADY=60;
  const keys=Object.keys(layers).map(Number).sort((a,b)=>a-b);
  if(G.nodes.length>=SUGIYAMA_MIN){
    sugiyamaLayer(G,inM,outM,byId,layers,keys,COL,ROW,PADX,PADY);
  } else {
    const pos=new Map();
    keys.forEach(k=>{ layers[k].sort((a,b)=>a.id<b.id?-1:1); layers[k].forEach((n,i)=>{n.x=PADX+k*COL;n.y=PADY+i*ROW;pos.set(n.id,n.y);}); });
    for(let p=0;p<4;p++) keys.forEach(k=>{ const col=layers[k];
      col.forEach(n=>{ const ps=inM.get(n.id).map(id=>pos.get(id)).filter(v=>v!=null); n.bary=ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:n.y; });
      col.sort((a,b)=>a.bary-b.bary); col.forEach((n,i)=>{n.y=PADY+i*ROW;pos.set(n.id,n.y);}); });
  }
  // adjacência para hover
  const amemo=new Map(),dmemo=new Map();
  const up=(id,s)=>{ if(amemo.has(id))return amemo.get(id); if(s.has(id))return new Set(); s.add(id);
    const r=new Set(); inM.get(id).forEach(p=>{r.add(p);up(p,s).forEach(x=>r.add(x));}); amemo.set(id,r);return r; };
  const dn=(id,s)=>{ if(dmemo.has(id))return dmemo.get(id); if(s.has(id))return new Set(); s.add(id);
    const r=new Set(); outM.get(id).forEach(c=>{r.add(c);dn(c,s).forEach(x=>r.add(x));}); dmemo.set(id,r);return r; };
  G.nodes.forEach(n=>{ n._up=up(n.id,new Set()); n._dn=dn(n.id,new Set()); });
  return G;
}

// ---------------- render (compartilhado) ----------------
// duplo canal: forma do nó por prioridade (não depende só de cor)
const SYM={P1:d3.symbolTriangle,P2:d3.symbolSquare,P3:d3.symbolCircle,FOUND:d3.symbolDiamond,SETUP:d3.symbolWye,POLISH:d3.symbolCross};
function nodeShape(d){
  const pri = d._t? d._t.priority : (d._d&&d._d.uc? d._d.uc.priority : null);
  const type = (pri&&SYM[pri])? SYM[pri] : d3.symbolCircle;
  return d3.symbol().type(type).size(d.r*d.r*3.2)();
}
const svg=d3.select('#svg'); let G, gRoot, zoom, pulseT, forceSim=null, forceRefreezeT=null;
const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const SHAPE_CHAR={P1:'▲',P2:'■',P3:'●',FOUND:'◆',SETUP:'✚',POLISH:'✖'};
function buildFor(tab){ const sp=DATA[state.spec];
  return tab==='usecases'?buildUsecases(sp): tab==='arch'?buildArch(sp): buildDeps(sp); }

function render(animate){
  clearInterval(pulseT);
  if(forceSim){ forceSim.stop(); forceSim=null; }
  if(forceRefreezeT){ clearTimeout(forceRefreezeT); forceRefreezeT=null; }
  // risco residual aceito: um hashchange durante um arrasto em voo pode recriar um forceSim
  // órfão sobre o G antigo (os listeners de mousemove do d3.drag sobrevivem à remoção do <g>);
  // autolimitado, para sozinho em ~700ms (refreeze) ou pelo decaimento natural de alpha
  hideHoverTip(); // a seleção de nós é recriada abaixo — não deixa o card apontando pra um nó destruído
  G=layout(buildFor(state.tab));
  const dg=diagFor(DATA[state.spec],state.tab); G.nodes.forEach(n=>{ n.diag=dg.get(n.id)||null; });
  const dfm=state.tab==='deps'?diffFor(DATA[state.spec]):null; if(dfm) G.nodes.forEach(n=>{ n.diffKind=dfm.get(n.id)||null; });
  if(state.focus && !G._byId.has(state.focus)) state.focus=null;
  const extLabels = state.tab!=='deps';
  svg.selectAll('*').remove();
  const defs=svg.append('defs');
  ['n','c'].forEach(k=>{ defs.append('marker').attr('id','arw-'+k).attr('viewBox','0 -5 10 10').attr('refX',9).attr('refY',0)
    .attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto')
    .append('path').attr('d','M0,-4L9,0L0,4').attr('fill',k==='c'?cssv('--sg-primary'):'rgba(255,255,255,.28)'); });
  gRoot=svg.append('g');
  const links=gRoot.append('g').selectAll('path').data(G.links).join('path')
    .attr('class',d=>'link'+(d.crit?' crit':'')).attr('marker-end',d=>d.crit?'url(#arw-c)':'url(#arw-n)')
    .attr('d',d=>edge(d));
  const node=gRoot.append('g').selectAll('g').data(G.nodes,d=>d.id).join('g')
    .attr('class',d=>'node'+(d.crit?' crit':'')+(d.done?' done':'')+(d.unblocked?' next':'')).attr('transform',d=>`translate(${d.x},${d.y})`)
    .attr('role','img').attr('aria-label',d=>(d.name||(d._t&&d._t.label)||d.idText||d.id));
  node.append('path').attr('class','sh').attr('d',d=>nodeShape(d)).attr('fill',d=>d.color);
  node.filter(d=>d.diag).append('circle').attr('class','diagdot').attr('cx',d=>d.r*.8).attr('cy',d=>-d.r*.8).attr('r',4.5)
    .attr('fill',d=>cssv(DIAG[d.diag.sev].c));
  node.filter(d=>d.diffKind).append('circle').attr('class','diffdot').attr('cx',d=>-d.r*.8).attr('cy',d=>-d.r*.8).attr('r',4.5)
    .attr('fill',d=>cssv(DIFFK[d.diffKind].c));
  node.filter(d=>d.idText).append('text').attr('class','id').text(d=>d.idText);
  if(extLabels) node.append('text').attr('class','ext').attr('x',d=>d.r+7).text(d=>trunc(d.name,22));
  node.on('mouseenter',(e,d)=>{hover(d);showHoverTip(e,d);}).on('mouseleave',()=>{hover(null);hideHoverTip();}).on('click',(e,d)=>{showDetail(d);e.stopPropagation();});

  // ---- arrasto com força local nos vizinhos diretos ----
  // simLinks/linkDist são só dados (sem timers) — calculados aqui, mas o forceSim só é
  // criado no 1º movimento real de um arrasto (dentro de dragged), nunca em render():
  // d3.forceSimulation dispara sozinho um tick automático na criação, e como esse render()
  // ainda vai rodar a animação de entrada dos nós logo abaixo, um forceSim eager sobrescreveria
  // o transform inicial (scale) antes da transição começar, zerando o efeito de entrada.
  const neighborsOf=id=>{ const s=new Set(G._in.get(id)||[]); (G._out.get(id)||[]).forEach(x=>s.add(x)); return s; };
  const onSimTick=()=>{ links.attr('d',d=>edge(d)); node.attr('transform',d=>`translate(${d.x},${d.y})`); };
  const linkDist=G.links.map(l=>{ const s=G._byId.get(l.source),t=G._byId.get(l.target);
    return (s&&t)? Math.max(40,Math.hypot(t.x-s.x,t.y-s.y)) : 80; });
  const simLinks=G.links.map(l=>({source:l.source,target:l.target})); // cópia-sombra: nunca muta G.links
  let dragMoved=false;
  const dragStarted=(e,d)=>{ e.sourceEvent.stopPropagation(); hideHoverTip(); dragMoved=false; d.fx=d.x; d.fy=d.y; };
  const dragged=(e,d)=>{
    if(!dragMoved){
      dragMoved=true;
      if(forceRefreezeT){ clearTimeout(forceRefreezeT); forceRefreezeT=null; }
      if(!forceSim){
        G.nodes.forEach(n=>{ n.fx=n.x; n.fy=n.y; }); // todos travados = layout atual, sem diff visual em repouso
        forceSim=d3.forceSimulation(G.nodes)
          .force('link', d3.forceLink(simLinks).id(n=>n.id).distance((l,i)=>linkDist[i]).strength(.55))
          .force('collide', d3.forceCollide(n=>n.r+16))
          .alpha(0).alphaDecay(.06)
          .on('tick', onSimTick);
      }
      const nb=neighborsOf(d.id);
      G.nodes.forEach(n=>{ if(n===d) return; if(nb.has(n.id)){ n.fx=null; n.fy=null; } else { n.fx=n.x; n.fy=n.y; } });
      d3.select(e.sourceEvent.target.closest('.node')).raise();
      if(!reduceMotion) forceSim.alphaTarget(.35).restart();
    }
    d.fx=e.x; d.fy=e.y;
    // sem alpha>0 o forceLink não desloca ninguém (alpha=0 é ponto fixo) — força um pulso
    // síncrono de alpha, converge em poucos ticks e volta a 0 pra não deixar nada "tocando" sozinho
    if(reduceMotion){ forceSim.alpha(1).tick(8).alpha(0); onSimTick(); }
  };
  const dragEnded=(e,d)=>{
    d.fx=e.x; d.fy=e.y;
    if(!dragMoved) return; // clique simples: não mexe na simulação, deixa o click abrir o detalhe
    const nb=neighborsOf(d.id);
    const refreeze=()=>{ nb.forEach(id=>{ const n=G._byId.get(id); if(n){ n.fx=n.x; n.fy=n.y; } }); drawMinimap(); };
    if(!reduceMotion){ forceSim.alphaTarget(0); forceRefreezeT=setTimeout(()=>{ refreeze(); forceRefreezeT=null; },700); }
    else refreeze();
  };
  node.call(d3.drag().on('start',dragStarted).on('drag',dragged).on('end',dragEnded).clickDistance(4));

  svg.on('click',()=>clearDetail());
  zoom=d3.zoom().scaleExtent([.2,3]).on('zoom',ev=>{gRoot.attr('transform',ev.transform); updateMiniViewport(ev.transform);}); svg.call(zoom); fit();
  if(animate!==false && !reduceMotion){
    node.style('opacity',0).attr('transform',d=>`translate(${d.x},${d.y}) scale(.2)`);
    node.transition().delay(d=>d.layer*110+Math.random()*70).duration(520).ease(d3.easeBackOut.overshoot(1.3))
      .style('opacity',1).attr('transform',d=>`translate(${d.x},${d.y}) scale(1)`);
    links.each(function(){const l=this.getTotalLength();d3.select(this).attr('stroke-dasharray',l).attr('stroke-dashoffset',l);})
      .transition().delay(d=>{const s=G._byId.get(d.source);return (s?s.layer:0)*110+200;}).duration(600)
      .attr('stroke-dashoffset',0).on('end',function(d){ if(!d.crit)d3.select(this).attr('stroke-dasharray',null); });
  }
  if(!reduceMotion && G.nodes.some(n=>n.crit)) perpetual();
  syncControls(); applyFilter(); buildAside(); drawMinimap(); updateSearch();
}
function edge(d){ const s=G._byId.get(d.source),t=G._byId.get(d.target); if(!s||!t)return'';
  if(d.waypoints&&d.waypoints.length){ const pts=[{x:s.x,y:s.y},...d.waypoints,{x:t.x,y:t.y}];
    let p='M'+pts[0].x+','+pts[0].y;
    for(let i=1;i<pts.length;i++){ const a=pts[i-1],b=pts[i],mx=(a.x+b.x)/2; p+=` C${mx},${a.y} ${mx},${b.y} ${b.x},${b.y}`; }
    return p; }
  const mx=(s.x+t.x)/2; return `M${s.x},${s.y} C${mx},${s.y} ${mx},${t.y} ${t.x},${t.y}`; }
function perpetual(){ gRoot.selectAll('.link.crit').attr('stroke-dasharray','8 6');
  const march=()=>gRoot.selectAll('.link.crit').transition().duration(900).ease(d3.easeLinear).attr('stroke-dashoffset',-14).on('end',function(){d3.select(this).attr('stroke-dashoffset',0);});
  march(); pulseT=setInterval(march,900); }
function fit(){ const b=gRoot.node().getBBox(),sw=svg.node().clientWidth,sh=svg.node().clientHeight;
  const k=Math.min(sw/(b.width+90),sh/(b.height+80),1.4), tx=(sw-b.width*k)/2-b.x*k, ty=(sh-b.height*k)/2-b.y*k;
  svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(k)); }
function centerNode(id){ const n=G._byId.get(id); if(!n||!zoom)return; const sw=svg.node().clientWidth,sh=svg.node().clientHeight,k=1.1;
  svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity.translate(sw/2-n.x*k,sh/2-n.y*k).scale(k)); }
const trunc=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;

// ---------------- minimapa ----------------
let miniParams=null;
function drawMinimap(){
  const mm=d3.select('#minimap'); mm.selectAll('*').remove();
  if(!G.nodes.length){ miniParams=null; return; }
  const xs=G.nodes.map(n=>n.x), ys=G.nodes.map(n=>n.y);
  const minx=Math.min(...xs)-40,maxx=Math.max(...xs)+40,miny=Math.min(...ys)-40,maxy=Math.max(...ys)+40;
  const gw=Math.max(1,maxx-minx),gh=Math.max(1,maxy-miny),mw=158,mh=114,k=Math.min(mw/gw,mh/gh),ox=(mw-gw*k)/2,oy=(mh-gh*k)/2;
  mm.attr('viewBox',`0 0 ${mw} ${mh}`);
  const g=mm.append('g').attr('transform',`translate(${ox},${oy}) scale(${k}) translate(${-minx},${-miny})`);
  g.selectAll('circle').data(G.nodes).join('circle').attr('cx',n=>n.x).attr('cy',n=>n.y).attr('r',4/k).attr('fill',n=>n.color).attr('opacity',.85);
  g.append('rect').attr('class','vp');
  miniParams={minx,miny,k,ox,oy,g};
  updateMiniViewport(d3.zoomTransform(svg.node()));
}
function updateMiniViewport(t){ if(!miniParams)return;
  const sw=svg.node().clientWidth,sh=svg.node().clientHeight;
  miniParams.g.select('.vp').attr('x',(0-t.x)/t.k).attr('y',(0-t.y)/t.k).attr('width',sw/t.k).attr('height',sh/t.k); }

function hover(d){ const nodes=gRoot.selectAll('.node'),links=gRoot.selectAll('.link');
  if(!d){ nodes.classed('dim',false); links.classed('dim',false); applyFilter(); return; }
  const keep=new Set([d.id,...d._up,...d._dn]);

// ---------------- card flutuante no hover (substitui o <title> nativo do SVG) ----------------
// Reaproveita G.detail(d) (mesmo conteúdo do painel de clique), sem botão de fechar — só
// aparece/some com mouseenter/mouseleave do nó. pointer-events:none garante que o card
// nunca captura o mouse (não "prende" o usuário, não precisa de UI de fechar).
let hoverTipTimer=null;
function showHoverTip(e,d){
  clearTimeout(hoverTipTimer);
  const nodeEl=e.currentTarget;
  hoverTipTimer=setTimeout(()=>{
    const el=document.getElementById('hovertip');
    el.innerHTML=G.detail(d,{compact:true});
    el.classList.remove('hide');
    positionHoverTip(nodeEl);
  },180);
}
function hideHoverTip(){
  clearTimeout(hoverTipTimer);
  document.getElementById('hovertip').classList.add('hide');
}
function positionHoverTip(nodeEl){
  const el=document.getElementById('hovertip'), r=nodeEl.getBoundingClientRect();
  // limites da própria .stage (não a janela inteira) — evita invadir a aside lateral
  const stage=document.querySelector('.stage').getBoundingClientRect();
  const pad=8, gap=10;
  // trava a altura ANTES de medir — conteúdo mais alto que a .stage (comum nas abas
  // Casos de uso/Arquitetura, que mostram G.detail() completo, sem o modo compacto)
  // vira scroll interno em vez de estourar por baixo da .stage.
  el.style.maxHeight=Math.max(120,stage.height-2*pad)+'px';
  const tw=el.offsetWidth, th=el.offsetHeight;
  let x=r.right+gap, y=r.top;
  if(x+tw>stage.right-pad) x=r.left-tw-gap;
  x=Math.max(stage.left+pad,Math.min(x,stage.right-tw-pad));
  y=Math.max(stage.top+pad,Math.min(y,stage.bottom-th-pad));
  el.style.left=x+'px'; el.style.top=y+'px';
}

function showDetail(d){ const el=document.getElementById('detail');
  const chain=(d._up&&d._up.size)||(d._dn&&d._dn.size);
  const focusBtn=chain?`<div style="margin-top:11px"><span class="chip" id="focusBtn" style="cursor:pointer">${state.focus===d.id?'✕ sair do foco':'🎯 focar a cadeia'}</span></div>`:'';
  const fin=(d.diag&&d.diag.findings.length)?`<div class="findings"><div style="font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--sg-text-softer);margin-bottom:6px">Diagnóstico</div>${d.diag.findings.map(f=>`<div class="diagitem"><span class="diagsev" style="background:${cssv(DIAG[f.severity].c)}"></span><span><span class="rid">${f.id}</span> · ${f.message}</span></div>`).join('')}</div>`:'';
  const dif=d.diffKind?`<div class="meta" style="margin-top:9px"><b>Desde a base:</b> <span style="color:${cssv(DIFFK[d.diffKind].c)}">${DIFFK[d.diffKind].label}</span></div>`:'';
  el.innerHTML=`<h3>Detalhe</h3>${G.detail(d)}${dif}${focusBtn}${fin}`;
  el.querySelectorAll('code[data-id]').forEach(c=>c.onclick=ev=>{ev.stopPropagation();const n=G._byId.get(c.dataset.id);if(n){showDetail(n);hover(n);}});
  const fb=el.querySelector('#focusBtn'); if(fb) fb.onclick=ev=>{ev.stopPropagation(); toggleFocus(d.id);};
  state.sel=d.id; writeHash(); }
function clearDetail(){ document.getElementById('detail').innerHTML='<h3>Detalhe</h3><div class="empty">Clique num nó para ver os detalhes.</div>'; state.sel=null; writeHash(); }

// ---------------- #15 foco numa task (isola a cadeia de dependências) ----------------
function fitToIds(ids){ const ns=[...ids].map(i=>G._byId.get(i)).filter(Boolean); if(!ns.length){fit();return;}
  const xs=ns.map(n=>n.x),ys=ns.map(n=>n.y),pad=70;
  const minx=Math.min(...xs)-pad,maxx=Math.max(...xs)+pad,miny=Math.min(...ys)-pad,maxy=Math.max(...ys)+pad;
  const w=Math.max(1,maxx-minx),h=Math.max(1,maxy-miny),sw=svg.node().clientWidth,sh=svg.node().clientHeight;
  const k=Math.min(sw/w,sh/h,1.6),tx=(sw-w*k)/2-minx*k,ty=(sh-h*k)/2-miny*k;
  svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(k)); }
function toggleFocus(id){ state.focus = state.focus===id ? null : id;
  syncFocusBadge(); applyFilter();
  const fs=focusSet(); fs?fitToIds(fs):fit();
  if(state.sel){ const n=G._byId.get(state.sel); if(n) showDetail(n); }
  writeHash(); }
function syncFocusBadge(){ const b=document.getElementById('focusBadge');
  if(state.focus){ document.getElementById('focusId').textContent=state.focus; b.classList.remove('hide'); }
  else b.classList.add('hide'); }

function buildDiag(sp){

  if(!state.diag||!findings.length){ card.classList.add('hide'); return; }
  card.classList.remove('hide');

  document.getElementById('diagCounts').innerHTML=Object.keys(DIAG).map(k=>`<span class="dc" style="color:${cssv(DIAG[k].c)}"><span class="diagsev" style="background:${cssv(DIAG[k].c)}"></span>${counts[k]||0}</span>`).join('');
  const dg=diagFor(sp,state.tab), nidOf=new Map(); dg.forEach((v,nid)=>v.findings.forEach(f=>nidOf.set(f,nid)));

// ---------------- v0.6.1 diff sobreposto (card no aside) ----------------
function buildDiffCard(sp){
  const card=document.getElementById('diffCard'), dd=sp.diff;
  if(!state.showDiff||!dd||state.tab!=='deps'){ card.classList.add('hide'); return; }
  card.classList.remove('hide');
  const p=dd.progress, pf=p.from.total?Math.round(p.from.done/p.from.total*100):0, pt=p.to.total?Math.round(p.to.done/p.to.total*100):0;
  document.getElementById('diffBase').textContent=`base: ${dd.base||'—'} · progresso ${pf}% → ${pt}%`;
  const df=diffFor(sp), ids=[...df.keys()].sort();

  if(!ids.length&&!rem.length&&!fa&&!fr) html='<div class="diffmeta">Sem mudanças em relação à base.</div>';
  const list=document.getElementById('diffList'); list.innerHTML=html;
  list.querySelectorAll('.diagitem[data-nid]').forEach(el=>el.onclick=()=>{const n=G._byId.get(el.dataset.nid);if(n){showDetail(n);hover(n);centerNode(n.id);}});
}

// ---------------- #16 kanban (quadro read-only: feito / em andamento / a fazer / bloqueadas) ----------------
function openStandup(){
  const sp=DATA[state.spec], gd=buildDeps(sp);
  const done=[],prog=[],ready=[],blocked=[];
  gd.nodes.forEach(n=>{ if(n.done)done.push(n); else if(n.inProgress)prog.push(n); else if(n.unblocked)ready.push(n); else blocked.push(n); });
  const byBlk=(a,b)=>(b._t.blocks-a._t.blocks)||(a.id<b.id?-1:1);
  [done,prog,ready,blocked].forEach(a=>a.sort(byBlk));
  const col=(title,color,icon,arr)=>{
    const items=arr.length?arr.map(n=>`<div class="su" data-id="${n.id}"><span class="tid">${n.id}</span><span>${trunc(n._t.label,64)}</span></div>`).join(''):'<div class="none">—</div>';
    return `<div class="col"><h4>${icon} ${title}<span class="cn" style="color:${color}">${arr.length}</span></h4>${items}</div>`; };
  const total=gd.nodes.length, proj=document.getElementById('hproj').textContent;
  const el=document.getElementById('standup');
  el.innerHTML=`<div class="panel"><div class="phead"><h2>📋 Kanban · ${proj}</h2><span class="pdate">${done.length}/${total} concluídas · ${prog.length} em andamento · ${ready.length} prontas · ${blocked.length} bloqueadas</span><button class="close" id="suClose" title="fechar">✕</button></div>
    <div class="cols">${col('Concluídas',cssv('--c-p3'),'✓',done)}${col('Em andamento',cssv('--c-p2'),'⟳',prog)}${col('Prontas p/ começar',cssv('--sg-accent-2'),'▶',ready)}${col('Bloqueadas',cssv('--k-external'),'⛔',blocked)}</div></div>`;
  el.classList.remove('hide');
  el.querySelector('#suClose').onclick=closeStandup;

}
function closeStandup(){ document.getElementById('standup').classList.add('hide'); }

// ---------------- 📈 timeline (painel visual da evolução ao longo dos commits) ----------------
function openTimeline(){
  if(!TL||!TL.points||TL.points.length<2) return;
  const pts=TL.points, proj=document.getElementById('hproj').textContent;
  const first=pts[0].progress.pct, last=pts[pts.length-1].progress.pct;
  const rows=pts.map(p=>`<tr><td class="mono">${p.label}</td><td>${p.date||'—'}</td><td>${p.progress.pct}% (${p.progress.done}/${p.progress.total})</td><td>${p.delta?(p.delta.completed||'·'):'—'}</td><td>${p.delta?(p.delta.added||'·'):'—'}</td><td>${p.findings.error}</td><td>${p.findings.warn}</td></tr>`).join('');
  const el=document.getElementById('tlpanel');
  el.innerHTML=`<div class="panel"><div class="phead"><h2>📈 Timeline · ${proj}</h2><span class="pdate">${pts.length} pontos · progresso ${first}% → ${last}%</span><button class="close" id="tlClose" title="fechar">✕</button></div>
    <div id="tlchart"></div>
    <table class="tltab"><thead><tr><th>Ponto</th><th>Data</th><th>Progresso</th><th>Concl.</th><th>Novas</th><th>Err</th><th>Avi</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  el.classList.remove('hide');
  el.querySelector('#tlClose').onclick=closeTimeline;
  el.onclick=ev=>{ if(ev.target===el) closeTimeline(); };
  drawTimelineChart(pts);
}
function closeTimeline(){ document.getElementById('tlpanel').classList.add('hide'); }
function drawTimelineChart(pts){
  const host=d3.select('#tlchart'); host.selectAll('*').remove();
  const n=pts.length, W=Math.max(560,Math.min(900,n*120)), H=230, m={t:22,r:20,b:40,l:40};
  const svg=host.append('svg').attr('viewBox',`0 0 ${W} ${H}`);
  const x=i=> m.l+(W-m.l-m.r)*(n>1?i/(n-1):0);
  const y=v=> H-m.b-(H-m.t-m.b)*(Math.max(0,Math.min(100,v))/100);
  [0,50,100].forEach(v=>{ svg.append('line').attr('class','grid').attr('x1',m.l).attr('x2',W-m.r).attr('y1',y(v)).attr('y2',y(v));
    svg.append('text').attr('class','ax').attr('x',m.l-6).attr('y',y(v)+3).text(v+'%'); });
  const pcts=pts.map(p=>p.progress.pct);
  const areaD=`M${x(0)},${y(0)} `+pcts.map((v,i)=>`L${x(i)},${y(v)}`).join(' ')+` L${x(n-1)},${y(0)} Z`;
  const lineD='M'+pcts.map((v,i)=>`${x(i)},${y(v)}`).join(' L');
  svg.append('path').attr('class','area').attr('d',areaD);
  svg.append('path').attr('class','ln').attr('d',lineD);
  pts.forEach((p,i)=>{ svg.append('circle').attr('class','dot').attr('cx',x(i)).attr('cy',y(p.progress.pct)).attr('r',4);
    svg.append('text').attr('class','pv').attr('x',x(i)).attr('y',y(p.progress.pct)-9).text(p.progress.pct+'%');
    svg.append('text').attr('class','px').attr('x',x(i)).attr('y',H-m.b+15).text(trunc(p.label,10)); });
}

function focusSet(){ if(!state.focus||!G._byId) return null; const f=G._byId.get(state.focus);
  return f?new Set([f.id,...f._up,...f._dn]):null; }
function applyFilter(){ const q=state.query.trim().toLowerCase(); const usePri=state.tab!=='arch';
  hideHoverTip(); // busca/filtro/foco podem esmaecer o nó sob o mouse — não deixa o card aberto sobre ele
  const fs=focusSet();
  gRoot.selectAll('.node').classed('faded',d=>!!(fs&&!fs.has(d.id))).style('opacity',d=>{
    if(fs&&!fs.has(d.id)) return .05;
    let ok = usePri && d._t ? state.active.has(d._t.priority) : true;
    if(usePri && d.kind==='usecase' && d._d) ok=state.active.has(d._d.uc.priority);
    if(ok&&q){ const hay=((d.name||'')+' '+(d.idText||'')+' '+(d._t?d._t.label:'')).toLowerCase(); ok=hay.includes(q); }
    let o=ok?1:.12; if(d.unlinked&&o===1&&!q) o=.4; if(state.hideDone&&d.done&&!q) o=.06; return o; });
  gRoot.selectAll('.link').style('opacity',l=>(fs&&!(fs.has(l.source)&&fs.has(l.target)))?.04:null);
  gRoot.selectAll('.link.crit').style('display',state.crit?null:'none'); }

// ---------------- UI ----------------
function syncControls(){
  let sub=TABS.find(t=>t.id===state.tab).sub;
  if(state.tab==='arch') sub='Componentes e fluxo · '+(DATA[state.spec].arch.source?'lido do código-fonte':'heurístico (só specs)');
  document.getElementById('tabsub').textContent=sub;
  document.getElementById('critToggle').classList.toggle('hide',state.tab!=='deps');
  document.getElementById('doneToggle').classList.toggle('hide',state.tab!=='deps');
  document.getElementById('standupBtn').classList.toggle('hide',state.tab!=='deps');
  document.getElementById('diffToggle').classList.toggle('hide',!(state.tab==='deps'&&!!DATA[state.spec].diff));
  document.getElementById('priBar').classList.toggle('hide',state.tab==='arch');
  syncFocusBadge();
  document.getElementById('progressCard').classList.toggle('hide',state.tab!=='deps');
  document.getElementById('nextCard').classList.toggle('hide',state.tab!=='deps');
  document.getElementById('hint').textContent = state.tab==='deps'
    ? 'arraste · zoom · passe o mouse num nó para ver o que ele bloqueia'
    : state.tab==='usecases' ? 'arraste · zoom · clique num caso de uso ou requisito'
    : 'arraste · zoom · clique num componente para ver o que ele agrupa';
}
function buildProgress(sp){
  const total=sp.tasks.length, done=sp.tasks.filter(t=>t.done).length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('pfill').style.width=pct+'%';
  document.getElementById('pmeta').textContent=`${done} / ${total} concluídas (${pct}%)`;
  const byp={}; sp.tasks.forEach(t=>{ (byp[t.priority]=byp[t.priority]||{d:0,t:0}); byp[t.priority].t++; if(t.done)byp[t.priority].d++; });
  document.getElementById('pby').innerHTML=Object.keys(PRI).filter(k=>byp[k]).map(k=>{const o=byp[k],p=Math.round(o.d/o.t*100),c=cssv(PRI[k].c);
    return `<div class="pbyrow"><span style="width:42px">${k}</span><span class="mini"><i style="width:${p}%;background:${c}"></i></span><span>${o.d}/${o.t}</span></div>`;}).join('');
  // próximas desbloqueáveis: todo com todas as deps concluídas, ordenado por quão bloqueante
  const nxt=G.nodes.filter(n=>n.unblocked).sort((a,b)=>(b._t.blocks-a._t.blocks)||(a.id<b.id?-1:1));
  const list=document.getElementById('nextList');
  list.innerHTML = nxt.length
    ? nxt.slice(0,15).map(n=>`<div class="nextitem" data-id="${n.id}"><span class="sw" style="background:${n.color}"></span><span class="tid">${n.id}</span> ${trunc(n._t.label,28)}</div>`).join('')
      + (nxt.length>15?`<div class="pmeta">+ ${nxt.length-15} outras</div>`:'')
    : `<div style="font-size:12px;color:var(--sg-text-softer);line-height:1.5">${done===total&&total?'Tudo concluído 🎉':'Nenhuma task pronta para começar agora (todas dependem de algo em aberto).'}</div>`;
  list.querySelectorAll('.nextitem').forEach(el=>el.onclick=()=>{const n=G._byId.get(el.dataset.id);if(n){showDetail(n);hover(n);centerNode(n.id);}});
}
function buildAside(){ const sp=DATA[state.spec];
  const st=document.getElementById('stats'), leg=document.getElementById('legend'), note=document.getElementById('legnote');
  // badge de confiança (índice 0–100)
  const cb=document.getElementById('confBadge'), conf=sp.confidence;
  if(cb){ if(conf&&conf.index!=null){ const v=conf.index, col=cssv(v>=85?'--c-p3':v>=60?'--c-p2':'--c-p1');
      cb.textContent='confiança '+v+'%'; cb.style.background=col+'22'; cb.style.color=col; cb.style.border='1px solid '+col+'55';
      cb.title='Como confiar neste grafo — '+Object.entries(conf.dims||{}).map(([k,x])=>k+': '+x+'%').join(' · ');
      cb.style.display=''; } else cb.style.display='none'; }
  if(state.tab==='deps'){
    const cnt={}; sp.tasks.forEach(n=>cnt[n.priority]=(cnt[n.priority]||0)+1);
    document.getElementById('statsTitle').textContent='Resumo'; document.getElementById('legTitle').textContent='Prioridade (cor)';
    st.innerHTML=stat(sp.tasks.length,'tasks')+stat(G.links.length,'dependências')+stat(cnt.P1||0,'P1 (MVP)','--c-p1')+stat(G.nodes.filter(n=>n.crit).length,'no caminho crítico','--sg-primary');
    leg.innerHTML=Object.entries(PRI).filter(([k])=>cnt[k]).map(([k,v])=>legrow(cssv(v.c),(SHAPE_CHAR[k]||'●')+' '+v.label,cnt[k])).join('')
      +legrow(cssv('--c-p3'),'✓ concluída (anel verde)','')+legrow(cssv('--sg-accent-2'),'pronta p/ começar (anel âmbar)','');
    note.innerHTML='Tamanho do nó = quantas tasks dependem dele.<br>Anel branco = caminho crítico.';
    buildProgress(sp);
  } else if(state.tab==='usecases'){
    const cnt={}; sp.usecases.forEach(u=>cnt[u.priority]=(cnt[u.priority]||0)+1);
    document.getElementById('statsTitle').textContent='Resumo'; document.getElementById('legTitle').textContent='Prioridade (cor)';
    st.innerHTML=stat(sp.usecases.length,'casos de uso')+stat(Object.keys(sp.frText).length,'requisitos (FR)')+stat(cnt.P1||0,'P1','--c-p1')+stat(1,'ator');
    leg.innerHTML=Object.entries(PRI).filter(([k])=>cnt[k]).map(([k,v])=>legrow(cssv(v.c),(SHAPE_CHAR[k]||'●')+' '+v.label,cnt[k])).join('')
      +legrow(cssv('--k-actor'),'Ator','')+legrow(cssv('--k-fr'),'Requisito (FR)','');
    note.innerHTML='Ator → casos de uso → requisitos que cada um cobre.';
  } else {
    const kinds={}; sp.arch.nodes.forEach(n=>kinds[n.kind]=(kinds[n.kind]||0)+1);
    document.getElementById('statsTitle').textContent='Resumo'; document.getElementById('legTitle').textContent='Tipo de componente (cor)';
    st.innerHTML=stat(sp.arch.nodes.length,'componentes')+stat(sp.arch.links.length,'conexões')+stat(sp.arch.nodes.filter(n=>n.kind==='external'||n.kind==='datastore').length,'externos')+stat((sp.arch.meta.language||'—').split(' ')[0],'linguagem');
    leg.innerHTML=Object.entries(KIND).filter(([k])=>kinds[k]).map(([k,v])=>legrow(cssv(v.c),v.label,kinds[k])).join('');
    note.innerHTML=sp.arch.source
      ? 'Fluxo da esquerda (usuário) para a direita. Cada serviço ligado ao adapter/modelo real, <b>lido dos imports do código</b> em <code>src/</code>.'
      : 'Fluxo da esquerda (usuário) para a direita. Derivado das pastas e do plan.md — <b>heurístico</b> (código-fonte não encontrado).';
  }
  buildDiag(sp);
  buildDiffCard(sp);
}
const stat=(n,l,c)=>`<div class="stat"><div class="n"${c?` style="color:${cssv(c)}"`:''}>${n}</div><div class="l">${l}</div></div>`;
const legrow=(c,l,n)=>`<div class="legrow"><span class="sw" style="background:${c}"></span>${l}${n!==''?` <span style="margin-left:auto;color:var(--sg-text-softer)">${n}</span>`:''}</div>`;

// ---------------- permalink (estado na URL via hash) ----------------
let hashReady=false;
function writeHash(){
  if(!hashReady) return;
  const p=['tab='+state.tab];
  if(SPECS.length>1) p.push('spec='+state.spec);
  if(state.sel) p.push('sel='+state.sel);
  if(state.query) p.push('q='+encodeURIComponent(state.query));
  const opt=[]; if(!state.crit)opt.push('nocrit'); if(state.hideDone)opt.push('hidedone'); if(state.diag)opt.push('diag'); if(state.showDiff)opt.push('diff'); if(opt.length)p.push('opt='+opt.join(','));
  if(state.focus) p.push('focus='+state.focus);
  if(state.active.size<Object.keys(PRI).length) p.push('pri='+[...state.active].join(','));
  const h='#'+p.join('&');
  if(location.hash!==h) history.replaceState(null,'',h);
}
function readHash(){
  const h=location.hash.replace(/^#/,''); if(!h)return null;
  const q={}; h.split('&').forEach(kv=>{const i=kv.indexOf('=');if(i>0)q[kv.slice(0,i)]=kv.slice(i+1);});
  if(q.tab&&TABS.some(t=>t.id===q.tab)) state.tab=q.tab;
  if(q.spec&&SPECS.includes(q.spec)) state.spec=q.spec;
  if(q.q!=null) state.query=decodeURIComponent(q.q);
  if(q.opt){ const o=q.opt.split(','); state.crit=!o.includes('nocrit'); state.hideDone=o.includes('hidedone'); state.diag=o.includes('diag'); state.showDiff=o.includes('diff'); }
  if(q.focus) state.focus=q.focus;
  if(q.pri) state.active=new Set(q.pri.split(',').filter(Boolean));
  return q.sel||null;
}
function syncUIToState(){
  [...tabsEl.children].forEach(b=>b.classList.toggle('active', b.textContent===TABS.find(t=>t.id===state.tab).label));
  [...specSeg.children].forEach((b,i)=>b.classList.toggle('active', SPECS[i]===state.spec));
  document.getElementById('search').value=state.query;
  document.getElementById('critToggle').classList.toggle('off',!state.crit);
  document.getElementById('doneToggle').classList.toggle('off',state.hideDone);
  document.getElementById('diagToggle').classList.toggle('off',!state.diag);
  document.body.classList.toggle('diag-on',state.diag);
  document.getElementById('diffToggle').classList.toggle('off',!state.showDiff);
  document.body.classList.toggle('diff-on',state.showDiff);
  priBar.querySelectorAll('.pri-tog').forEach(t=>t.style.opacity=state.active.has(t.dataset.k)?1:.3);
}

// tabs
const tabsEl=document.getElementById('tabs');
TABS.forEach(t=>{ const b=document.createElement('button'); b.textContent=t.label; if(t.id===state.tab)b.className='active';
  b.onclick=()=>{ state.tab=t.id; state.sel=null; [...tabsEl.children].forEach(c=>c.classList.remove('active')); b.classList.add('active'); render(true); writeHash(); }; tabsEl.appendChild(b); });
// specs
const specSeg=document.getElementById('specSeg');
SPECS.forEach(s=>{ const b=document.createElement('button'); b.textContent=s.replace(/^\d+-/,'').replace(/-/g,' ');
  if(s===state.spec)b.className='active'; b.onclick=()=>{state.spec=s;state.sel=null;[...specSeg.children].forEach(c=>c.classList.remove('active'));b.classList.add('active');render(true);writeHash();}; specSeg.appendChild(b); });
if(SPECS.length<2) specSeg.style.display='none';
// filtro de prioridade
const priBar=document.getElementById('priBar'); priBar.style.padding='4px 6px';
priBar.innerHTML=Object.entries(PRI).map(([k,v])=>`<span class="pri-tog" data-k="${k}" title="${v.label}" style="display:inline-flex;align-items:center;gap:4px;margin:0 4px;cursor:pointer"><span class="sw" style="width:11px;height:11px;border-radius:50%;background:var(${v.c})"></span><span style="font-size:11px">${k}</span></span>`).join('');
priBar.querySelectorAll('.pri-tog').forEach(t=>t.onclick=()=>{const k=t.dataset.k; if(state.active.has(k)){state.active.delete(k);t.style.opacity=.3;}else{state.active.add(k);t.style.opacity=1;} applyFilter();writeHash();});
document.getElementById('critToggle').onclick=function(){ state.crit=!state.crit; this.classList.toggle('off',!state.crit); applyFilter(); writeHash(); };
document.getElementById('doneToggle').onclick=function(){ state.hideDone=!state.hideDone; this.classList.toggle('off',!state.hideDone); applyFilter(); writeHash(); };
document.getElementById('diagToggle').onclick=function(){ state.diag=!state.diag; this.classList.toggle('off',!state.diag); document.body.classList.toggle('diag-on',state.diag); buildDiag(DATA[state.spec]); writeHash(); };
document.getElementById('diffToggle').onclick=function(){ state.showDiff=!state.showDiff; this.classList.toggle('off',!state.showDiff); document.body.classList.toggle('diff-on',state.showDiff); buildDiffCard(DATA[state.spec]); writeHash(); };
document.getElementById('standupBtn').onclick=openStandup;
document.getElementById('timelineBtn').onclick=openTimeline;
if(TL&&TL.points&&TL.points.length>=2) document.getElementById('timelineBtn').classList.remove('hide');
document.getElementById('focusBadge').onclick=()=>{ if(state.focus) toggleFocus(state.focus); };
document.getElementById('search').oninput=e=>{state.query=e.target.value;matchIdx=0;applyFilter();updateSearch();writeHash();};
document.getElementById('search').onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();gotoMatch();} };
document.getElementById('navPrev').onclick=()=>{ if(matches.length){matchIdx=(matchIdx-1+matches.length)%matches.length;gotoMatch();} };
document.getElementById('navNext').onclick=()=>{ if(matches.length){matchIdx=(matchIdx+1)%matches.length;gotoMatch();} };
d3.select('#minimap').on('click',function(ev){ if(!miniParams)return; const [px,py]=d3.pointer(ev,this);
  const gx=(px-miniParams.ox)/miniParams.k+miniParams.minx, gy=(py-miniParams.oy)/miniParams.k+miniParams.miny;
  const sw=svg.node().clientWidth,sh=svg.node().clientHeight,t=d3.zoomTransform(svg.node());
  svg.transition().duration(400).call(zoom.transform,d3.zoomIdentity.translate(sw/2-gx*t.k,sh/2-gy*t.k).scale(t.k)); });
document.getElementById('replay').onclick=()=>render(true);
document.getElementById('linkBtn').onclick=function(){ writeHash(); const u=location.href;
  const done=()=>{ const o=this.textContent; this.textContent='✓ copiado'; setTimeout(()=>this.textContent=o,1400); };
  if(navigator.clipboard) navigator.clipboard.writeText(u).then(done,done); else done(); };
// acessibilidade: tema claro/escuro + paleta segura (persistidos; localStorage
// blindado porque file:// pode restringir o acesso em alguns ambientes)
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
function applyA11y(){ const r=document.documentElement;
  const th=LS.get('sg-theme'); th?r.setAttribute('data-theme',th):r.removeAttribute('data-theme');
  const pal=LS.get('sg-palette'); pal?r.setAttribute('data-palette',pal):r.removeAttribute('data-palette');
  document.getElementById('paletteBtn').classList.toggle('off',pal!=='safe');
}
document.getElementById('themeBtn').onclick=()=>{ const cur=document.documentElement.getAttribute('data-theme');
  cur==='light'?LS.del('sg-theme'):LS.set('sg-theme','light'); applyA11y(); render(true); };
document.getElementById('paletteBtn').onclick=()=>{ const cur=document.documentElement.getAttribute('data-palette');
  cur==='safe'?LS.del('sg-palette'):LS.set('sg-palette','safe'); applyA11y(); render(true); };
// export: serializa o SVG visível (com estilos e cores do tema atual) + PNG via canvas
function svgStyleBlock(){
  const link=gRoot.select('.link').node(), lc=link?getComputedStyle(link):null;
  const critEl=gRoot.select('.link.crit').node(), cc=critEl?getComputedStyle(critEl):null;
  const idEl=gRoot.select('text.id').node(), ic=idEl?getComputedStyle(idEl):null;
  const shEl=gRoot.select('.node path.sh, .node circle').node(), sc=shEl?getComputedStyle(shEl):null;
  const extEl=gRoot.select('text.ext').node(), ec=extEl?getComputedStyle(extEl):null;
  return `.link{fill:none;stroke:${lc?lc.stroke:'#888'};stroke-width:1.3}
.link.crit{stroke:${cc?cc.stroke:cssv('--sg-primary')};stroke-width:2.2}
.node path.sh,.node circle{stroke:${sc?sc.stroke:'#000'};stroke-width:1.5}
.node.crit path.sh,.node.crit circle{stroke:${cssv('--sg-text')};stroke-width:2}
.node.done path.sh{stroke:${cssv('--c-p3')};stroke-width:2}
.node.next path.sh{stroke:${cssv('--sg-accent-2')};stroke-width:2.5}
text.id{font-family:monospace;font-size:9px;font-weight:600;fill:${ic?ic.fill:'#fff'};text-anchor:middle;dominant-baseline:central}
text.ext{font-size:11px;font-weight:600;fill:${ec?ec.fill:cssv('--sg-text-soft')};dominant-baseline:central}`;
}
function serializeSVG(){
  const s=svg.node(), w=s.clientWidth, h=s.clientHeight, clone=s.cloneNode(true);
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg'); clone.setAttribute('width',w); clone.setAttribute('height',h);
  const bg=document.createElementNS('http://www.w3.org/2000/svg','rect'); bg.setAttribute('width',w);bg.setAttribute('height',h);bg.setAttribute('fill',cssv('--sg-bg'));
  clone.insertBefore(bg,clone.firstChild);
  const st=document.createElementNS('http://www.w3.org/2000/svg','style'); st.textContent=svgStyleBlock(); clone.insertBefore(st,clone.firstChild);
  return {data:'<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(clone), w, h};
}
function dl(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); }
document.getElementById('svgBtn').onclick=()=>{ const {data}=serializeSVG(); dl(new Blob([data],{type:'image/svg+xml'}),`sdd-graph-${state.spec}-${state.tab}.svg`); };
document.getElementById('pngBtn').onclick=()=>{ const {data,w,h}=serializeSVG(); const img=new Image(); const sc=2;
  img.onload=()=>{ const c=document.createElement('canvas'); c.width=w*sc; c.height=h*sc; const ctx=c.getContext('2d'); ctx.scale(sc,sc); ctx.drawImage(img,0,0); c.toBlob(b=>b&&dl(b,`sdd-graph-${state.spec}-${state.tab}.png`)); };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(data); };
document.getElementById('hproj').textContent=document.title.replace('Mapa SDD','').trim()||'projeto';
window.addEventListener('resize',()=>{clearTimeout(window._rt);window._rt=setTimeout(fit,200);});
window.addEventListener('hashchange',()=>{ const s=readHash(); syncUIToState(); render(true); if(s){const n=G._byId.get(s);if(n){showDetail(n);hover(n);setTimeout(()=>centerNode(s),650);}} });

// init: aplica acessibilidade, hidrata do hash (permalink), sincroniza UI e renderiza
applyA11y();
const _pending=readHash(); hashReady=true; syncUIToState();
render(true);
if(_pending){ const n=G._byId.get(_pending); if(n){ showDetail(n); hover(n); setTimeout(()=>centerNode(_pending),700); } }
</script>
